services:
  db:
    image: postgres:16
    container_name: factory_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-factorydb}
    ports:
      - "5432:5432"
    volumes:
      - factory_pgdata:/var/lib/postgresql/data
volumes:
  factory_pgdata:
