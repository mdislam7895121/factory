# ── Netlify Build Configuration — Factory Frontend ───────────────────────────
# Frontend: Netlify (Next.js App Router)
# Backend/API/Runtime: Railway (never moved to Netlify)

[build]
  base    = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS    = "--no-fund --no-audit"
  NEXT_TELEMETRY_DISABLED = "1"

# ── Next.js plugin ─────────────────────────────────────────────────────────────
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Production context ────────────────────────────────────────────────────────
[context.production]
  command = "npm run build"

  [context.production.environment]
    NEXT_PUBLIC_APP_ENV = "production"
    # Set on Netlify dashboard (never commit values):
    # NEXT_PUBLIC_API_BASE_URL      = https://your-api.railway.app
    # NEXT_PUBLIC_PREVIEW_BASE_URL  = https://your-preview.railway.app
    # NEXT_PUBLIC_ANALYTICS_ENABLED = true

# ── Branch deploy: active development branch ───────────────────────────────────
[context."claude/code-audit-review-bERxc"]
  command = "npm run build"

  [context."claude/code-audit-review-bERxc".environment]
    NEXT_PUBLIC_APP_ENV = "staging"

# ── Deploy preview (PRs) ───────────────────────────────────────────────────────
[context.deploy-preview]
  command = "npm run build"

  [context.deploy-preview.environment]
    NEXT_PUBLIC_APP_ENV = "preview"

# ── Redirects ─────────────────────────────────────────────────────────────────
# API calls go directly to Railway via NEXT_PUBLIC_API_BASE_URL — no open proxy.
# No /api/* proxy to avoid arbitrary-target open-proxy security risk.

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # style-src unsafe-inline: Next.js injects inline styles — documented accepted risk.
    # script-src unsafe-eval: Next.js dev/hydration uses eval — acceptable in build.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"

# ── Static asset caching ──────────────────────────────────────────────────────
[[headers]]
  for = "/_next/static/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"

  [headers.values]
    Cache-Control = "public, max-age=86400"
