[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "perpetual"
version = "0.1.0"
description = "Official Python SDK for the Perpetual Sandbox Engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["sandbox", "ai", "agents", "perpetual", "code-execution"]
dependencies = []

[project.urls]
Homepage = "https://perpetual.dev"
Repository = "https://github.com/mdtazizulislam/factory"

[tool.setuptools.packages.find]
where = ["."]
include = ["perpetual*"]
